- name: Create VMs
  hosts: all
  gather_facts: false
  vars:
    cloud_pass: redhat
    lab_rsa: "ssh-rsa  root@wsphost" 

  tasks:

    - name: Create labkey secret
      redhat.openshift.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: labkey
            namespace: "{{ target_ns }}"
          type: Opaque
          data:
            key: "{{ lab_rsa | b64encode }}"

    - name: Create VM from template
      vars:
        j2vm_name: j2vm
        itype: u1.small
        add_net: true
      redhat.openshift.k8s:
        state: present
        template: "templates/create_vm.yml.j2"
      register: templatevm
      until: templatevm is succeeded
      retries: 60
      delay: 10
      failed_when: templatevm is failed or templatevm.failed

    - name: Include task to create vm
      ansible.builtin.import_tasks: tasks/create_vm_task.yml
      vars:
        vm_settings:
          - vmname: 'small'
            itype: 'u1.small'
          - vmname: 'medium'
            itype: 'u1.medium'
